name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: python3 scripts/build.py

      - name: Read project name
        id: project
        run: echo "name=$(sed -n 's/^name = "\(.*\)"/\1/p' wrangler.toml)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: pages deploy dist --project-name=${{ steps.project.outputs.name }} --branch=main
